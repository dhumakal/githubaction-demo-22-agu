name: Install PHP on Windows

on:
  workflow_dispatch:

jobs:

  job1:
    runs-on: windows-latest

    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP version
        run: php --version

  job2:
    runs-on: windows-latest

    steps:
      - name: Install PHP on Windows runner
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP version
        run: php --version
